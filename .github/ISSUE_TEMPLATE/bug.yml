name: Проблема / Bug
description: Что-то не работает или работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Быстрее всего — кнопка **«Сообщить о проблеме»** в программе (меню «Ещё»): она сама подставит сведения о системе и журнал.
        The quickest way is the **Report a problem** button in the app (More menu).
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      placeholder: Например — после обновления не открывается YouTube, пробовал стратегии ALT и ALT2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить / Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: input
    id: versions
    attributes:
      label: Версии / Versions
      placeholder: ZapretGUI 2.3.1 · zapret 1.10.4 · Windows 11 25H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал / Log
      description: «Ещё» → «Журнал событий» → «Копировать»
      render: text
