# ZapretGUI build on GitHub: on every push and pull request the app is built and the autotests run.
# On a new tag vX.Y.Z: build, then create the release with notes from CHANGELOG.md (section "## X.Y.Z"),
# or, if the release already exists without files, upload ZapretGUI.exe and .sha256 to it.
# Keep the scripts ASCII-only: Windows PowerShell on the runner misreads non-ASCII text.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI
          path: |
            ZapretGUI.exe
            ZapretGUI.exe.sha256

      - name: Release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # notes = the CHANGELOG.md section of this version
            $text = [IO.File]::ReadAllText("CHANGELOG.md", [Text.Encoding]::UTF8).Replace("`r", "")
            $start = $text.IndexOf("`n## $ver")
            $notes = "See CHANGELOG.md"
            if ($start -ge 0) {
              $start = $text.IndexOf("`n", $start + 1) + 1
              $end = $text.IndexOf("`n## ", $start)
              $notes = if ($end -lt 0) { $text.Substring($start) } else { $text.Substring($start, $end - $start) }
            }
            [IO.File]::WriteAllText("notes.md", $notes.Trim(), (New-Object Text.UTF8Encoding $false))
            gh release create $tag ZapretGUI.exe ZapretGUI.exe.sha256 --repo $repo --title "ZapretGUI $ver" --notes-file notes.md
          } else {
            $assets = gh release view $tag --repo $repo --json assets -q ".assets | length"
            if ([int]$assets -eq 0) { gh release upload $tag ZapretGUI.exe ZapretGUI.exe.sha256 --repo $repo }
            else { "Release $tag already has files - leaving them as is" }
          }
