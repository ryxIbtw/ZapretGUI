# Сборка ZapretGUI на GitHub: при каждом push и pull request — проверка, что программа собирается и проходят автотесты.
# При новом теге vX.Y.Z — сборка и загрузка ZapretGUI.exe и .sha256 в релиз, если в нём ещё нет файлов.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Автотесты
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI
          path: |
            ZapretGUI.exe
            ZapretGUI.exe.sha256

      - name: Файлы в релиз (только если их там ещё нет)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo ${{ github.repository }} 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag ZapretGUI.exe ZapretGUI.exe.sha256 --repo ${{ github.repository }} --title "ZapretGUI $($tag.TrimStart('v'))" --generate-notes
          } else {
            $assets = gh release view $tag --repo ${{ github.repository }} --json assets -q ".assets | length"
            if ([int]$assets -eq 0) { gh release upload $tag ZapretGUI.exe ZapretGUI.exe.sha256 --repo ${{ github.repository }} }
            else { "В релизе $tag уже есть файлы — не трогаю" }
          }
